    <script>
      // Apply the saved light/dark choice before first paint, so the page never flashes.
      try { var t = localStorage.getItem('tarbya.theme'); if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
